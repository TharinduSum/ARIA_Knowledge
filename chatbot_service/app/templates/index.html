<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARIA Knowledge Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>

  <div class="app-container">
    <!-- Header Bar -->
    <header class="header">
      <div class="header-title">
        <div class="bot-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" />
            <rect x="4" y="8" width="16" height="12" rx="2" />
            <circle cx="9" cy="13" r="1" />
            <circle cx="15" cy="13" r="1" />
            <path d="M10 17h4" />
          </svg>
        </div>
        <div>
          <h1>ARIA Knowledge Assistant</h1>
        </div>
      </div>

      <div class="header-status">
        <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Light/Dark Theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <div class="status-badge">
          <span id="db-status-dot" class="dot"></span>
          <span id="db-status-text">Checking...</span>
        </div>
      </div>
    </header>

    <!-- Chat History Feed -->
    <main id="chat-window" class="chat-window">
      <!-- Welcome Message -->
      <div class="message-row assistant">
        <div class="avatar">AI</div>
        <div class="message-bubble markdown-body">
          <p>👋 Hello! I am your <strong>ARIA Knowledge Assistant</strong>.</p>
          <p>Ask me anything about your uploaded documents, policies, or knowledge base!</p>
        </div>
      </div>
    </main>

    <!-- Input Footer -->
    <footer class="input-area">
      <div class="toolbar">
        <div class="toolbar-options">
          <label class="toggle-container">
            <input type="checkbox" id="stream-toggle" checked>
            <span>Real-time SSE Streaming</span>
          </label>
        </div>

        <div class="select-container">
          <label for="top-k-select">Context Chunks: </label>
          <select id="top-k-select">
            <option value="3">Top 3 Chunks</option>
            <option value="5" selected>Top 5 Chunks</option>
            <option value="10">Top 10 Chunks</option>
          </select>
        </div>
      </div>

      <div class="input-box">
        <textarea id="user-input" placeholder="Type your query here..." rows="1"></textarea>
        <button id="send-btn" class="send-btn" title="Send Message">
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="/static/script.js"></script>
</body>

</html>
